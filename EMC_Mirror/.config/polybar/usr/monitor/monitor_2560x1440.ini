[monitor-data]

# KOORUI E2721F 27" 

# 2560x1440
launchbar_center_width = 30%
launchbar_center_offset_x = 33.8%

# shows all launchbars in center position
launchbar_left_offset_x = 42.6%
launchbar_right_offset_x = 42.6%

# change for left and right launchbar
launchbar_width = 15%
# change for all launchbars
launchbar_offset_y = 94%

mainbar_height = 30pt
launchbar_height = 24pt

# change only size and offset!
# size=<yoursize;youroffset
mainbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=16;4
mainbar_font_1 = Noto Sans:size=16;4

launchbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=14;3
launchbar_font_1 = Noto Sans:size=14;3
