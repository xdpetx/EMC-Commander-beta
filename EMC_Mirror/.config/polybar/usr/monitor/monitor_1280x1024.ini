[monitor-data]

# KOORUI E2721F 27" 

# 1280x1024
launchbar_center_width = 39%
launchbar_center_offset_x = 30.8% 

# shows all launchbars in center position
launchbar_left_offset_x = 40.3%
launchbar_right_offset_x = 40.3%

# change for left and right launchbar
launchbar_width = 20%
# change for all launchbars
launchbar_offset_y = 93.7%

mainbar_height = 22pt
launchbar_height = 16pt

# change only size and offset!
# size=<yoursize;youroffset
mainbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=9.5;2
mainbar_font_1 = Noto Sans:size=9.5;2

launchbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=8.5;2
launchbar_font_1 = Noto Sans:size=8.5;2
