#changed
[module/filesys]
type = internal/fs
interval = 25

mount-0 = ${app-data.filesys_mount}

label-mounted = %mountpoint% %percentage_used%%
format-mounted = %{A1:$_SCRIPTDIR/info_filesys.sh left:}%{A6:$_SCRIPTDIR/info_filesys.sh dbl_left:}%{A3:$_SCRIPTDIR/info_filesys.sh right:}%{A8:$_SCRIPTDIR/info_filesys.sh dbl_right:}%{A4: :}%{A5: :} <label-mounted> %{A}%{A}%{A}%{A}%{A}%{A}

format-mounted-prefix = %{A1:$_SCRIPTDIR/event_filesys.sh left:}%{A6:$_SCRIPTDIR/event_filesys.sh dbl_left:}%{A3:$_SCRIPTDIR/event_filesys.sh right:}%{A8:$_SCRIPTDIR/event_filesys.sh dbl_right:}%{A4:$_SCRIPTDIR/event_filesys.sh up:}%{A5:$_SCRIPTDIR/event_filesys.sh down:}󰋊%{A}%{A}%{A}%{A}%{A}%{A}
format-mounted-prefix-foreground = ${colors.primary}

label-unmounted = %mountpoint%
label-unmounted-foreground = ${colors.disabled}
format-unmounted = %{A1:$_SCRIPTDIR/info_filesys.sh left:}%{A6:$_SCRIPTDIR/info_filesys.sh dbl_left:}%{A3:$_SCRIPTDIR/info_filesys.sh right:}%{A8:$_SCRIPTDIR/info_filesys.sh dbl_right:}%{A4: :}%{A5: :} <label-unmounted> %{A}%{A}%{A}%{A}%{A}%{A}

;format-unmounted-prefix = %{A1:$_SCRIPTDIR/event_filesys.sh left:}%{A3:$_SCRIPTDIR/event_filesys.sh right:}%{A4: :}%{A5: :}󰋊%{A}%{A}%{A}%{A}
format-unmounted-prefix = %{A1:$_SCRIPTDIR/event_filesys.sh left:}%{A6:$_SCRIPTDIR/event_filesys.sh dbl_left:}%{A3:$_SCRIPTDIR/event_filesys.sh right:}%{A8:$_SCRIPTDIR/event_filesys.sh dbl_right:}%{A4:$_SCRIPTDIR/event_filesys.sh up:}%{A5:$_SCRIPTDIR/event_filesys.sh down:}󰋊%{A}%{A}%{A}%{A}%{A}%{A}
format-unmounted-prefix-foreground = ${colors.disabled}

# changed
[module/keyboard]
type = internal/xkeyboard

format = %{A1:$_SCRIPTDIR/info_keyboard.sh left:}%{A6: :}%{A3:$_SCRIPTDIR/info_keyboard.sh right:}%{A8: :}%{A4: :}%{A5: :} <label-layout><label-indicator>  %{A}%{A}%{A}%{A}%{A}%{A}
