label-connected = "ON"
format-connected = %{A1:$_SCRIPTDIR/info_eth.sh left:}%{A6:$_SCRIPTDIR/info_eth.sh dbl_left:}%{A3:$_SCRIPTDIR/info_eth.sh right :}%{A8: :}%{A4: :}%{A5: :} <label-connected>  %{A}%{A}%{A}%{A}%{A}%{A}

format-connected-prefix = %{A1:$_SCRIPTDIR/event_eth.sh left:}%{A6:$_SCRIPTDIR/event_eth.sh dbl_left:}%{A3:$_SCRIPTDIR/event_eth.sh right:}%{A8:$_SCRIPTDIR/event_eth.sh dbl_right:}%{A4:$_SCRIPTDIR/event_eth.sh up:}%{A5:$_SCRIPTDIR/event_eth.sh down:}󰈀%{A}%{A}%{A}%{A}%{A}%{A}
