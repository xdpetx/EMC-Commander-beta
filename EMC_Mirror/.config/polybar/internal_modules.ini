# internal modules in alphabetical order

# changed
[module/cpu]
type = internal/cpu
interval = 2

label = %percentage:2%%
format = %{A1:$_SCRIPTDIR/info_cpu.sh left:}%{A6:$_SCRIPTDIR/info_cpu.sh dbl_left:}%{A3:$_SCRIPTDIR/info_cpu.sh right:}%{A8: :}%{A4: :}%{A5: :} <label>  %{A}%{A}%{A}%{A}%{A}%{A}

format-prefix = %{A1:$_SCRIPTDIR/event_cpu.sh left:}%{A6:$_SCRIPTDIR/event_cpu.sh dbl_left:}%{A3:$_SCRIPTDIR/event_cpu.sh right:}%{A8:$_SCRIPTDIR/event_cpu.sh dbl_right:}%{A4:$_SCRIPTDIR/event_cpu.sh up:}%{A5:$_SCRIPTDIR/event_cpu.sh down:}%{A}%{A}%{A}%{A}%{A}%{A}
format-prefix-foreground = ${colors.primary}

# changed
[module/date]
type = internal/date
interval = 10

date = "%H:%M"

label = %date%
format = %{A1:$_SCRIPTDIR/info_date.sh left:}%{A6: :}%{A3:$_SCRIPTDIR/info_date.sh right:}%{A8: :}%{A4: :}%{A5: :} <label>  %{A}%{A}%{A}%{A}%{A}%{A}

format-prefix = %{A1:$_SCRIPTDIR/event_date.sh left:}%{A6:$_SCRIPTDIR/event_date.sh dbl_left:}%{A3:$_SCRIPTDIR/event_date.sh right:}%{A8:$_SCRIPTDIR/event_date.sh dbl_right:}%{A4:$_SCRIPTDIR/event_date.sh up:}%{A5:$_SCRIPTDIR/event_date.sh down:}%{A}%{A}%{A}%{A}%{A}%{A}
format-prefix-foreground = ${colors.primary}

# changed
[module/eth]
