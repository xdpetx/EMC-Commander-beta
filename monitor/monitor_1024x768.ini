[monitor-data]

# KOORUI E2721F 27" 

# 1024x768
# This resolution is simply too low for a usable view.
launchbar_center_width = 48%
launchbar_center_offset_x = 26% 

# shows all launchbars in center position
launchbar_left_offset_x = 38.5%
launchbar_right_offset_x = 39.5%

# change for left and right launchbar
launchbar_width = 20%
# change for all launchbars
launchbar_offset_y = 92.5%

mainbar_height = 18pt
launchbar_height = 16pt

# change only size and offset!
# size=<yoursize;youroffset
mainbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=8;2
mainbar_font_1 = Noto Sans:size=8;2

launchbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=8;2
launchbar_font_1 = Noto Sans:size=8;2
