[monitor-data]

# Acer 20"

# 1366x768
launchbar_center_width = 37%
launchbar_center_offset_x = 30.5%

# shows all launchbars in center position
launchbar_left_offset_x = 41.5%
launchbar_right_offset_x = 41.5%

# change for left and right launchbar
launchbar_width = 18.5%
# change for all launchbars
launchbar_offset_y = 91.5%

mainbar_height = 22pt
launchbar_height = 18pt

# change only size and offset!
# size=<yoursize;youroffset
mainbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=10;2
mainbar_font_1 = Noto Sans:size=10;2

launchbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=9;2
launchbar_font_1 = Noto Sans:size=9;2
