[monitor-data]

# KOORUI E2721F 27" 

# 1440x900
launchbar_center_width = 37%
launchbar_center_offset_x = 31.8%

# shows all launchbars in center position
launchbar_left_offset_x = 41.2%
launchbar_right_offset_x = 41.2%

# change for left and right toolbar
launchbar_width = 18%
# change for all toolbars
launchbar_offset_y = 93.3%

mainbar_height = 21pt
launchbar_height = 15pt

# change only size and offset!
# size=<yoursize;youroffset
mainbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=9.5;2
mainbar_font_1 = Noto Sans:size=9.5;2

launchbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=8;2
launchbar_font_1 = Noto Sans:size=8;2
