[monitor-data]

# Acer 20"

# 1600x900
launchbar_center_width = 33%
launchbar_center_offset_x = 33% 

# shows all launchbars in center position
launchbar_left_offset_x = 40.5%
launchbar_right_offset_x = 40.5%

# change for left and right launchbar
launchbar_width = 20%
# change for all launchbars
launchbar_offset_y = 92.75%

mainbar_height = 22pt
launchbar_height = 18pt

# change only size and offset!
# size=<yoursize;youroffset
mainbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=11;2
mainbar_font_1 = Noto Sans:size=11;2

launchbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=10;2
launchbar_font_1 = Noto Sans:size=10;2
