[monitor-data]

# KOORUI E2721F 27" 

# 1680x1050
launchbar_center_width = 37%
launchbar_center_offset_x = 30.2% 

# shows all launchbars in center position
launchbar_left_offset_x = 40.7%
launchbar_right_offset_x = 40.7%

# change for left and right launchbar
launchbar_width = 19%
# change for all launchbars
launchbar_offset_y = 93.8%

mainbar_height = 23pt
launchbar_height = 17pt

# change only size and offset!
# size=<yoursize;youroffset
mainbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=12;2
mainbar_font_1 = Noto Sans:size=12;2

launchbar_font_0 = Symbols Nerd Font Mono:style=Regular:size=11;2
launchbar_font_1 = Noto Sans:size=11;2
